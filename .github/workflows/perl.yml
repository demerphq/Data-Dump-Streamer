name: Perl

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stable:
    name: Perl ${{ matrix.perl }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        perl:
          - '5.18'
          - '5.20'
          - '5.22'
          - '5.24'
          - '5.26'
          - '5.28'
          - '5.30'
          - '5.32'
          - '5.34'
          - '5.36'
          - '5.38'
          - '5.40'
          - '5.42'
          - '5.44'
    steps:
      - uses: actions/checkout@v6
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: ${{ matrix.perl }}
      - name: Report interpreter
        run: perl -V
      - name: Install build and test dependencies
        run: cpanm --verbose PadWalker Algorithm::Diff
      - name: Install optional JSON test dependency
        continue-on-error: true
        run: cpanm --verbose Cpanel::JSON::XS
      - name: Configure and test
        run: |
          perl Makefile.PL DDS
          make
          make test

  refcounted-stack:
    name: Development Perl with refcounted stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.44'
      - name: Build the development interpreter
        run: |
          cpanm --verbose App::perlbrew
          perlbrew init
          perlbrew install --as dds-rc-stack --debug -j 4 -Dusedevel -Accflags='-DPERL_RC_STACK -DDEBUG_LEAKING_SCALARS' perl-5.45.4
      - name: Install dependencies and test with the refcounted stack
        shell: bash
        run: |
          dds_cpanm="$(command -v cpanm)"
          source "$HOME/perl5/perlbrew/etc/bashrc"
          perlbrew use dds-rc-stack
          perl -V
          perl -e 'die "Refcounted stack is disabled\n" unless Internals::stack_refcounted() & 1'
          perl "$dds_cpanm" --verbose PadWalker Algorithm::Diff
          if ! perl "$dds_cpanm" --verbose Cpanel::JSON::XS; then
            echo 'Optional JSON dependency installation failed; its tests skip if the module is unavailable.'
          fi
          perl Makefile.PL DDS
          make
          PERL_DESTRUCT_LEVEL=2 make test

  threaded:
    name: Perl 5.44 with ithreads
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shogo82148/actions-setup-perl@v1
        with:
          perl-version: '5.44'
          multi-thread: true
      - run: cpanm --verbose PadWalker Algorithm::Diff
      - name: Install optional JSON test dependency
        continue-on-error: true
        run: cpanm --verbose Cpanel::JSON::XS
      - run: |
          perl -MConfig -e 'die "ithreads disabled\n" unless $Config{useithreads}'
          perl Makefile.PL DDS
          make test
